services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: citypoucave
      POSTGRES_USER: citypoucave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/donnees_factices.sql:/docker-entrypoint-initdb.d/02-donnees-factices.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citypoucave -d citypoucave"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
